*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Roboto Flex Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#dcd8e2;color:#1d1b20;padding:28px 32px 36px;width:max-content}
.intest{max-width:1560px;margin-bottom:22px}
.intest h1{font:800 30px/1.2 inherit;font-family:inherit;letter-spacing:.01em}
.intest p{font:400 16px/1.45 inherit;font-family:inherit;color:#49454f;margin-top:6px;max-width:980px}
.quadri{display:flex;gap:28px;align-items:flex-start}
figure{flex:none}
figcaption{font:600 14px/1.3 inherit;font-family:inherit;color:#49454f;margin-top:10px;text-align:center}
.cornice{padding:9px;border-radius:44px;background:#1b1a1f;box-shadow:0 18px 40px rgb(0 0 0/.22)}
.schermo{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:35px;background:var(--colore-sfondo);color:var(--colore-su-sfondo)}
.ritaglio{color:var(--colore-su-sfondo);border-radius:28px;padding:14px 16px;background:var(--colore-sfondo);box-shadow:0 18px 40px rgb(0 0 0/.18)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* App header */
.barra{flex:none;padding:30px 6px 4px 16px;border-bottom:1px solid var(--colore-contorno-variante)}
.barra-int{display:flex;align-items:center;gap:2px}
.desk .schermo{border-radius:14px}.desk{border-radius:22px}
.desk .barra{padding:4px 24px}
.desk .barra-int,.desk .contenuto{width:100%;max-width:1040px;margin:0 auto}
.desk .contenuto{padding:20px 24px 20px;gap:16px}
.desk .slots{grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:20px}
.desk .v2 .azioni{grid-template-rows:minmax(0,1fr) 72px}
.desk .v2 .reg .disco{width:88px;height:88px}
figure.largo{display:inline-block}
.desk .rivela{width:100%;max-width:520px;align-self:center}
.marchio{flex:1;min-width:0}
.marchio h1{font-size:22px;line-height:28px;font-weight:800;letter-spacing:.02em;color:var(--colore-primario)}
.marchio p{font-size:12px;line-height:16px;font-weight:500;color:var(--colore-su-superficie-variante);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icona-btn{display:grid;place-items:center;width:56px;height:56px;border-radius:999px;color:var(--colore-primario)}
.nuova{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border-radius:999px;color:var(--colore-primario);font-weight:600;font-size:16px}

.contenuto{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px 14px}
.slots{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:12px}

/* Slot card */

  display:flex;flex-direction:column;min-height:0;padding:2px 12px 12px;border-radius:28px;background:var(--colore-contenitore-superficie-basso);border:1px solid var(--colore-contorno-variante)}
.slot.b{--accento:var(--colore-terziario);--su-accento:var(--colore-su-terziario);--cont-accento:var(--colore-contenitore-terziario);--su-cont-accento:var(--colore-su-contenitore-terziario)}
.slot.rec{border-color:var(--colore-errore);box-shadow:0 0 0 2px color-mix(in srgb,var(--colore-errore) 30%,transparent)}
.testa{flex:none;display:flex;align-items:center;gap:10px;min-height:56px}
.numero{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accento);color:var(--su-accento);font-weight:700;font-size:16px}
.titoli{flex:1;min-width:0}
.titoli h2{font-size:16px;line-height:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titoli h2 small{font-size:13px;font-weight:400;color:var(--colore-su-superficie-variante)}
.stato{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:16px;font-weight:500;color:var(--colore-su-superficie-variante);white-space:nowrap}
.punto{width:8px;height:8px;border-radius:50%;background:var(--accento)}
.rec .punto{background:var(--colore-errore)}
.scarica{display:grid;place-items:center;width:56px;height:56px;margin-right:-10px;border-radius:999px;color:var(--colore-su-superficie-variante)}
.azioni{flex:1;min-height:0;display:grid;gap:8px;container-type:size}

/* Controls */
.c{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-width:56px;min-height:56px;overflow:hidden;text-align:left}
.lab{display:grid;min-width:0}
.lab b{font-weight:700}
.sub{font-size:12px;line-height:16px;font-weight:500;opacity:.92}
.col{flex-direction:column;gap:6px;text-align:center}

.reg{border-radius:28px;background:var(--colore-contenitore-superficie-massimo);color:var(--colore-su-superficie);font-size:18px}
.disco{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--colore-errore);color:var(--colore-su-errore)}
.con{border-radius:28px;background:var(--accento);color:var(--su-accento);font-size:20px}
.ori{border-radius:999px;border:1px solid var(--colore-contorno);color:var(--accento);font-size:16px;font-weight:600}
.chip-lucchetto{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 6px;border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent);font-size:12px;font-weight:600;white-space:nowrap}
.timer{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vu{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;height:8px;width:100%;max-width:150px}
.vu i{border-radius:2px;background:color-mix(in srgb,currentColor 28%,transparent)}
.vu i.on{background:currentColor}
.reg.attivo{background:var(--colore-errore);color:var(--colore-su-errore)}
.reg.attivo .disco{background:var(--colore-su-errore);color:var(--colore-errore)}
.reg.attivo::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:86%;background:currentColor;opacity:.6}
.dis{background:color-mix(in srgb,var(--colore-su-superficie) 10%,transparent)!important;color:color-mix(in srgb,var(--colore-su-superficie) 45%,transparent)!important;border-color:transparent!important}

/* Reveal bar */
.rivela{flex:none;display:flex;align-items:center;gap:14px;height:64px;padding:0 12px 0 22px;border-radius:999px;background:var(--colore-primario);color:var(--colore-su-primario);font-size:18px}
.rivela .lab{flex:1;text-align:left}
.rivela .luc{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,currentColor 16%,transparent)}

.v5 .azioni{grid-template-columns:2fr 1fr;grid-template-rows:minmax(0,1fr) minmax(56px,1fr)}
.v5 .con{grid-column:1/-1;justify-content:flex-start;padding:0 16px 0 12px;gap:12px}
.v5 .con .tondo{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--su-accento);color:var(--accento)}
.v5 .onda{flex:1;min-width:40px;height:min(46px,60%);opacity:.75}
.v5 .reg{justify-content:flex-start;padding-left:10px;font-size:18px}
.v5 .reg .disco{width:min(52px,80cqh);height:min(52px,80cqh)}
.v5 .ori{border-radius:28px;flex-direction:column;gap:2px;font-size:14px}
.v5 .ori .chip-lucchetto{font-size:11px}
.v5 .reg.attivo{gap:8px}
.v5 .reg.attivo .disco{width:44px;height:44px}</style></head>
